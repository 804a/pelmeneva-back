server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pelmeni_db
    username: pelmeni_user
    password: pelmeni_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

